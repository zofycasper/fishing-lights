<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="北岸钓鱼红绿灯">
    <meta name="theme-color" content="#111827">
    <title>北岸钓鱼红绿灯 | North Shore Fishing Lights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .light-card { transition: all 0.3s; }
        .green { background: linear-gradient(135deg, #10b981, #34d399); }
        .yellow { background: linear-gradient(135deg, #eab308, #facc15); }
        .red { background: linear-gradient(135deg, #ef4444, #f87171); }
        .install-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 flex items-center justify-center gap-3">
                🎣 北岸钓鱼红绿灯
            </h1>
            <p class="text-gray-400">Veritas 轻/中套专用 · Auckland North Shore</p>
            <div id="last-update" class="text-sm text-gray-500 mt-2"></div>
        </header>

        <!-- Today -->
        <div class="mb-10">
            <h2 class="text-2xl font-semibold mb-4 flex items-center justify-between">
                <span class="flex items-center gap-2">
                    <i class="fas fa-calendar-day"></i> 今天 (Today)
                </span>
                <button onclick="refreshData()" 
                        class="text-sm px-4 py-1.5 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 rounded-full flex items-center gap-2 transition-colors">
                    <i class="fas fa-sync-alt"></i> 
                    <span>刷新</span>
                </button>
            </h2>
            <div id="today-card" class="light-card rounded-3xl p-8 shadow-inner cursor-pointer active:scale-[0.985] transition-transform" onclick="showDayModal('today')"></div>
        </div>

        <!-- Forecast -->
        <div>
            <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> 未来5天预报 (Next 5 Days)
            </h2>
            <div id="forecast-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <div class="mt-10 text-xs text-gray-500 text-center pb-20">
            数据来自 Open-Meteo + NIWA 潮汐逻辑 · 仅供参考，安全第一！
            <br>刷新页面获取最新数据
        </div>

        <!-- Install to Home Screen Button -->
        <button id="install-btn"
                class="install-btn hidden bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 px-8 rounded-2xl flex items-center gap-2 text-base shadow-xl">
            <i class="fas fa-download"></i>
            <span>添加到手机主屏幕（像App一样用）</span>
        </button>
    </div>

    <!-- Day Detail Modal -->
    <div id="day-modal" class="hidden fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-[200]">
        <div onclick="event.target.id === 'day-modal' && hideDayModal()" class="absolute inset-0"></div>
        
        <div class="relative bg-gray-800 w-full md:w-[420px] md:rounded-3xl rounded-t-3xl p-6 shadow-2xl max-h-[85vh] overflow-auto">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <div id="modal-date" class="text-xl font-bold"></div>
                    <div id="modal-subtitle" class="text-sm text-gray-400"></div>
                </div>
                <button onclick="hideDayModal()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>

            <div id="modal-weather" class="mb-6"></div>

            <div id="modal-tide" class="mb-6"></div>

            <button onclick="window.open('https://tides.niwa.co.nz/', '_blank')" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-2xl text-sm font-medium flex items-center justify-center gap-2 transition-colors">
                <i class="fas fa-external-link-alt"></i>
                <span>打开 NIWA 官方潮汐查询（最准确）</span>
            </button>

            <div class="mt-4 text-[10px] text-center text-gray-500">
                潮汐数据请以 NIWA 官方为准 • 安全第一
            </div>
        </div>
    </div>

    <script>
        const LAT = -36.8;
        const LON = 174.75;

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m,wind_direction_10m,weather_code&hourly=wind_speed_10m,wind_direction_10m&daily=weather_code,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset&timezone=Pacific/Auckland`;
                const res = await fetch(url);
                const data = await res.json();
                return data;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        function getLightStatus(windSpeed) {
            if (windSpeed < 10) return { color: 'green', text: '🟢 绿灯 - 两套都合适', desc: '轻风，微物+中套都舒服' };
            if (windSpeed < 16) return { color: 'yellow', text: '🟡 黄灯 - 推荐中套', desc: '有chop，轻套慎用' };
            return { color: 'red', text: '🔴 红灯 - 建议在家保养', desc: '强风，危险+效果差' };
        }

        function getEmoji(code) {
            const map = { 0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 51: '🌧️', 61: '🌧️', 71: '❄️', 80: '🌦️' };
            return map[code] || '🌥️';
        }

        function getWindDirection(deg) {
            if (deg == null || isNaN(deg)) return '';
            const dirs = ["北风", "北偏东风", "东北风", "东偏北风", "东风", "东偏南风", "东南风", "南偏东风",
                          "南风", "南偏西风", "西南风", "西偏南风", "西风", "西偏北风", "西北风", "北偏西风"];
            const index = Math.floor((deg + 11.25) / 22.5) % 16;
            return dirs[index];
        }

        function estimateCurrentTide() {
            const now = new Date();
            const high1 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 12);
            const low1  = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 5);
            const high2 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 45);
            const low2  = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 30);

            const highHeight = 3.10;
            const lowHeight  = 0.50;

            let h1, l1, fromHighToLow;

            if (now < low1) {
                h1 = high1; l1 = low1; fromHighToLow = true;
            } else if (now < high2) {
                h1 = low1; l1 = high2; fromHighToLow = false;
            } else {
                h1 = high2; l1 = low2; fromHighToLow = true;
            }

            const totalMs = l1 - h1;
            const progress = Math.max(0, Math.min(1, (now - h1) / totalMs));

            let height;
            if (fromHighToLow) {
                height = highHeight + (lowHeight - highHeight) * Math.sin(progress * Math.PI / 2);
            } else {
                height = lowHeight + (highHeight - lowHeight) * (1 - Math.cos(progress * Math.PI)) / 2;
            }

            const isRising = !fromHighToLow;
            const status = isRising ? '涨潮' : '落潮';
            const nextExtreme = isRising ? high2 : low1;
            const diffMs = nextExtreme - now;
            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            return {
                height: Math.max(lowHeight, Math.min(highHeight, height)),
                status: status,
                nextLabel: isRising ? '高潮' : '低潮',
                nextIn: `${hours}小时${mins}分钟`
            };
        }

        function renderToday(data) {
            if (!data) {
                document.getElementById('today-card').innerHTML = `<p class="text-red-400">数据加载失败，请刷新</p>`;
                return;
            }

            const wind = Math.round(data.current.wind_speed_10m);
            const dir = Math.round(data.current.wind_direction_10m);
            const windDirText = getWindDirection(dir);
            const status = getLightStatus(wind);
            const tide = estimateCurrentTide();

            const tideHTML = `
                <div class="mt-6 pt-4 border-t border-black/20 flex items-center justify-between text-sm">
                    <div>
                        <span class="opacity-80">当前潮位</span><br>
                        <span class="text-2xl font-bold">${tide.height.toFixed(2)}</span>
                        <span class="text-sm">m</span>
                    </div>
                    <div class="text-right">
                        <span class="px-2.5 py-0.5 rounded-full text-xs ${tide.status === '涨潮' ? 'bg-emerald-500/20 text-emerald-700' : 'bg-orange-500/20 text-orange-700'}">${tide.status}</span><br>
                        <span class="text-xs opacity-70">距${tide.nextLabel} ${tide.nextIn}</span>
                    </div>
                </div>
            `;

            const html = `
                <div class="${status.color} text-black rounded-3xl p-8 shadow-inner cursor-pointer active:scale-[0.985] transition-transform" onclick="showDayModal('today')">
                    <div class="text-6xl mb-4">${status.text}</div>
                    <div class="text-2xl font-medium">${wind} knots ${windDirText}</div>
                    <div class="mt-6 text-xl">${status.desc}</div>
                    <div class="mt-8 flex justify-center gap-8 text-sm">
                        <div>🌬️ ${wind} knots</div>
                        <div>📍 North Shore</div>
                    </div>
                    ${tideHTML}
                </div>
            `;
            document.getElementById('today-card').innerHTML = html;
            document.getElementById('last-update').textContent = `更新时间: ${new Date().toLocaleTimeString('zh-CN')} NZST`;
        }

        function renderForecast(daily) {
            const container = document.getElementById('forecast-container');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dayName = date.toLocaleDateString('zh-CN', { weekday: 'short' });

                const maxWind = Math.round(daily.wind_speed_10m_max[i]);
                const windDir = daily.wind_direction_10m_dominant ? daily.wind_direction_10m_dominant[i] : null;
                const windDirText = getWindDirection(windDir);
                const status = getLightStatus(maxWind);
                const weatherEmoji = getEmoji(daily.weather_code[i]);

                const card = document.createElement('div');
                card.className = `light-card rounded-2xl p-6 ${status.color} text-black cursor-pointer active:scale-[0.985] transition-transform`;
                card.innerHTML = `
                    <div class="text-lg font-medium">${dayName} ${date.getDate()}日</div>
                    <div class="text-5xl my-4">${weatherEmoji}</div>
                    <div class="text-3xl font-bold">${status.text.split(' - ')[0]}</div>
                    <div class="mt-2 text-sm">${maxWind} knots ${windDirText}</div>
                `;
                card.onclick = () => showDayModal('forecast', i);
                container.appendChild(card);
            }
        }

        async function refreshData() {
            const refreshBtns = document.querySelectorAll('button[onclick*="refreshData"]');
            refreshBtns.forEach(btn => {
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-sync-alt fa-spin"></i> <span>刷新中...</span>`;
            });

            const todayCard = document.getElementById('today-card');
            todayCard.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10">
                    <i class="fas fa-sync-alt fa-spin text-4xl text-emerald-400 mb-4"></i>
                    <p class="text-gray-400">正在获取最新天气数据...</p>
                </div>
            `;

            await init();

            refreshBtns.forEach(btn => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-sync-alt"></i> <span>刷新</span>`;
            });
        }

        function showDayModal(type, index = null) {
            const modal = document.getElementById('day-modal');
            const modalDate = document.getElementById('modal-date');
            const modalSubtitle = document.getElementById('modal-subtitle');
            const modalWeather = document.getElementById('modal-weather');
            const modalTide = document.getElementById('modal-tide');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (type === 'today') {
                modalDate.textContent = '今天 (Today)';
                modalSubtitle.textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' }) + ' · North Shore';
                
                modalWeather.innerHTML = document.getElementById('today-card').innerHTML;

                const tide = estimateCurrentTide();
                const weatherData = window.lastWeatherData || {};
                const sunriseTime = weatherData.daily?.sunrise?.[0] ? new Date(weatherData.daily.sunrise[0]).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}) : '07:19';
                const sunsetTime = weatherData.daily?.sunset?.[0] ? new Date(weatherData.daily.sunset[0]).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}) : '17:16';

                modalTide.innerHTML = `
                    <div class="flex justify-between items-center mb-4 text-sm">
                        <div class="flex items-center gap-1.5">
                            <i class="fas fa-clock text-gray-400"></i>
                            <span>${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="flex items-center gap-4 text-xs">
                            <div class="flex items-center gap-1">
                                <i class="fas fa-sun text-yellow-400"></i>
                                <span>${sunriseTime}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-moon text-orange-400"></i>
                                <span>${sunsetTime}</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4 p-4 bg-white/5 rounded-2xl">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm text-gray-300">当前潮位（正弦波模型估算）</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full ${tide.status === '涨潮' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-orange-500/20 text-orange-400'}">${tide.status}</span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-5xl font-bold tracking-tighter">${tide.height.toFixed(2)}</span>
                            <span class="text-2xl text-gray-400">m</span>
                        </div>
                        <div class="text-xs text-gray-400 mt-0.5">距离下次${tide.nextLabel}约 ${tide.nextIn}</div>
                    </div>

                    <div class="text-sm">
                        <div class="grid grid-cols-3 gap-x-4 text-xs text-gray-400 mb-1 px-1">
                            <div class="font-medium">潮汐</div>
                            <div class="text-center font-medium">高度</div>
                            <div class="text-right font-medium">时间</div>
                        </div>
                        <div class="space-y-px text-sm">
                            <div class="grid grid-cols-3 gap-x-4 items-center bg-white/5 px-3 py-1.5 rounded-t-xl">
                                <span class="font-medium text-red-400">高潮 1</span>
                                <span class="font-mono text-center">2.98 m</span>
                                <span class="font-mono text-right text-gray-400">06:12</span>
                            </div>
                            <div class="grid grid-cols-3 gap-x-4 items-center bg-white/5 px-3 py-1.5">
                                <span class="font-medium text-blue-400">低潮 1</span>
                                <span class="font-mono text-center">0.68 m</span>
                                <span class="font-mono text-right text-gray-400">12:05</span>
                            </div>
                            <div class="grid grid-cols-3 gap-x-4 items-center bg-white/5 px-3 py-1.5">
                                <span class="font-medium text-red-400">高潮 2</span>
                                <span class="font-mono text-center">2.78 m</span>
                                <span class="font-mono text-right text-gray-400">18:45</span>
                            </div>
                            <div class="grid grid-cols-3 gap-x-4 items-center bg-white/5 px-3 py-1.5 rounded-b-xl">
                                <span class="font-medium text-blue-400">低潮 2</span>
                                <span class="font-mono text-center">0.78 m</span>
                                <span class="font-mono text-right text-gray-400">00:30 (+1)</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 text-[10px] text-center text-gray-500">当前潮位使用正弦波模型估算 • 精确数据请以 NIWA 为准</div>
                `;
            } else {
                const date = new Date();
                date.setDate(date.getDate() + index);
                const dayName = date.toLocaleDateString('zh-CN', { weekday: 'long', month: 'long', day: 'numeric' });
                
                modalDate.textContent = dayName;
                modalSubtitle.textContent = 'North Shore';

                modalWeather.innerHTML = `
                    <div class="bg-gray-700 rounded-2xl p-4 text-center">
                        <div class="text-5xl mb-2">${document.querySelectorAll('#forecast-container > div')[index].querySelector('.text-5xl').innerHTML}</div>
                        <div class="text-xl font-bold">${document.querySelectorAll('#forecast-container > div')[index].querySelector('.text-3xl').innerHTML}</div>
                        <div class="text-sm mt-1 text-gray-300">${document.querySelectorAll('#forecast-container > div')[index].querySelector('.mt-2').innerHTML}</div>
                    </div>
                `;

                modalTide.innerHTML = `
                    <div class="p-4 bg-white/5 rounded-2xl text-center text-gray-400">
                        <i class="fas fa-info-circle mb-2"></i>
                        <p class="text-sm">未来日期的详细潮汐请使用 NIWA 官方查询</p>
                    </div>
                `;
            }
        }

        function hideDayModal() {
            const modal = document.getElementById('day-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function init() {
            const data = await fetchWeather();
            if (data) {
                window.lastWeatherData = data;
                renderToday(data);
                renderForecast(data.daily);
            } else {
                document.getElementById('today-card').innerHTML = `<p class="text-red-400 text-center py-12">网络问题，请检查连接后刷新</p>`;
            }
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        function isIOSSafari() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }
        if (isIOSSafari() && !window.navigator.standalone) {
            setTimeout(() => {
                installBtn.innerHTML = `<i class="fas fa-share-alt"></i> <span>点击分享按钮 → 添加到主屏幕</span>`;
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex', 'bg-blue-600', 'hover:bg-blue-700');
            }, 3000);
        }

        init();
        setInterval(init, 30 * 60 * 1000);
    </script>
</body>
</html>
