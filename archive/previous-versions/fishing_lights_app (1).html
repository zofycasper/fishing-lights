<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="北岸钓鱼红绿灯">
    <meta name="theme-color" content="#111827">
    <title>北岸钓鱼红绿灯 | North Shore Fishing Lights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .light-card { transition: all 0.3s; }
        .green { background: linear-gradient(135deg, #10b981, #34d399); }
        .yellow { background: linear-gradient(135deg, #eab308, #facc15); }
        .red { background: linear-gradient(135deg, #ef4444, #f87171); }
        .install-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 flex items-center justify-center gap-3">
                🎣 北岸钓鱼红绿灯
            </h1>
            <p class="text-gray-400">Veritas 轻/中套专用 · Auckland North Shore</p>
            <div id="last-update" class="text-sm text-gray-500 mt-2"></div>
        </header>

        <!-- Today -->
        <div class="mb-10">
            <h2 class="text-2xl font-semibold mb-4 flex items-center justify-between">
                <span class="flex items-center gap-2">
                    <i class="fas fa-calendar-day"></i> 今天 (Today)
                </span>
                <button onclick="refreshData()" 
                        class="text-sm px-4 py-1.5 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 rounded-full flex items-center gap-2 transition-colors">
                    <i class="fas fa-sync-alt"></i> 
                    <span>刷新</span>
                </button>
            </h2>
            <div id="today-card" class="light-card rounded-3xl p-8 text-center shadow-2xl"></div>
        </div>

        <!-- Forecast -->
        <div>
            <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> 未来5天预报 (Next 5 Days)
            </h2>
            <div id="forecast-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <div class="mt-10 text-xs text-gray-500 text-center pb-20">
            数据来自 Open-Meteo + NIWA 潮汐逻辑 · 仅供参考，安全第一！
            <br>刷新页面获取最新数据
        </div>

        <!-- Install to Home Screen Button -->
        <button id="install-btn"
                class="install-btn hidden bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 px-8 rounded-2xl flex items-center gap-2 text-base shadow-xl">
            <i class="fas fa-download"></i>
            <span>添加到手机主屏幕（像App一样用）</span>
        </button>
    </div>

    <script>
        // Auckland North Shore coordinates
        const LAT = -36.8;
        const LON = 174.75;

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m,wind_direction_10m,weather_code&hourly=wind_speed_10m,wind_direction_10m&daily=weather_code,wind_speed_10m_max&timezone=Pacific/Auckland`;
                const res = await fetch(url);
                const data = await res.json();
                return data;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        function getLightStatus(windSpeed, isDaytime = true) {
            if (windSpeed < 10) return { color: 'green', text: '🟢 绿灯 - 两套都合适', desc: '轻风，微物+中套都舒服' };
            if (windSpeed < 16) return { color: 'yellow', text: '🟡 黄灯 - 推荐中套', desc: '有chop，轻套慎用' };
            return { color: 'red', text: '🔴 红灯 - 建议在家保养', desc: '强风，危险+效果差' };
        }

        function getEmoji(code) {
            const map = { 0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 51: '🌧️', 61: '🌧️', 71: '❄️', 80: '🌦️' };
            return map[code] || '🌥️';
        }

        function renderToday(data) {
            if (!data) {
                document.getElementById('today-card').innerHTML = `<p class="text-red-400">数据加载失败，请刷新</p>`;
                return;
            }

            const wind = Math.round(data.current.wind_speed_10m);
            const dir = Math.round(data.current.wind_direction_10m);
            const status = getLightStatus(wind);

            const html = `
                <div class="${status.color} text-black rounded-3xl p-8 shadow-inner">
                    <div class="text-6xl mb-4">${status.text}</div>
                    <div class="text-2xl font-medium">${wind} knots ${dir}°</div>
                    <div class="mt-6 text-xl">${status.desc}</div>
                    <div class="mt-8 flex justify-center gap-8 text-sm">
                        <div>🌬️ ${wind} knots</div>
                        <div>📍 North Shore</div>
                    </div>
                </div>
            `;
            document.getElementById('today-card').innerHTML = html;
            document.getElementById('last-update').textContent = `更新时间: ${new Date().toLocaleTimeString('zh-CN')} NZST`;
        }

        function renderForecast(daily) {
            const container = document.getElementById('forecast-container');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dayName = date.toLocaleDateString('zh-CN', { weekday: 'short' });

                const maxWind = Math.round(daily.wind_speed_10m_max[i]);
                const status = getLightStatus(maxWind);
                const weatherEmoji = getEmoji(daily.weather_code[i]);

                const card = document.createElement('div');
                card.className = `light-card rounded-2xl p-6 ${status.color} text-black`;
                card.innerHTML = `
                    <div class="text-lg font-medium">${dayName} ${date.getDate()}日</div>
                    <div class="text-5xl my-4">${weatherEmoji}</div>
                    <div class="text-3xl font-bold">${status.text.split(' - ')[0]}</div>
                    <div class="mt-3 text-sm">${maxWind} knots 最大风</div>
                `;
                container.appendChild(card);
            }
        }

        async function refreshData() {
            const refreshBtns = document.querySelectorAll('button[onclick*="refreshData"]');
            refreshBtns.forEach(btn => {
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-sync-alt fa-spin"></i> <span>刷新中...</span>`;
            });

            const todayCard = document.getElementById('today-card');
            todayCard.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10">
                    <i class="fas fa-sync-alt fa-spin text-4xl text-emerald-400 mb-4"></i>
                    <p class="text-gray-400">正在获取最新天气数据...</p>
                </div>
            `;

            await init();

            refreshBtns.forEach(btn => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-sync-alt"></i> <span>刷新</span>`;
            });
        }

        async function init() {
            const data = await fetchWeather();
            if (data) {
                renderToday(data);
                renderForecast(data.daily);
            } else {
                document.getElementById('today-card').innerHTML = `<p class="text-red-400 text-center py-12">网络问题，请检查连接后刷新</p>`;
            }
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        // Also show install button on iOS Safari (manual instruction)
        function isIOSSafari() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }
        if (isIOSSafari() && !window.navigator.standalone) {
            setTimeout(() => {
                installBtn.innerHTML = `<i class="fas fa-share-alt"></i> <span>点击分享按钮 → 添加到主屏幕</span>`;
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex', 'bg-blue-600', 'hover:bg-blue-700');
            }, 3000);
        }

        // Auto run
        init();

        // Refresh every 30 min
        setInterval(init, 30 * 60 * 1000);
    </script>
</body>
</html>
