<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        .light-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .light-card:active { transform: scale(0.985); }

        .yellow { background: linear-gradient(135deg, #eab308, #facc15); }
        .red { background: linear-gradient(135deg, #ef4444, #f87171); }
        .wind-chart-container { background: #1f2937; border-radius: 16px; padding: 12px; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto p-6">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold tracking-tight">🎣 北岸钓鱼红绿灯 <span class="text-base text-gray-500 align-super">v5.11</span></h1>

                </button>
                <button onclick="showLogicModal()" class="inline-flex items-center gap-2 px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">

            <div id="update-status" class="text-xs text-gray-500 mt-2 font-mono"></div>
        </div>

        <div class="mb-7">

                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition-colors rounded-2xl flex items-center justify-center gap-2 font-medium">

            </button>
            <div class="text-center text-[10px] text-gray-500 mt-1.5">实时精确潮汐请以 NIWA 为准 • 安全第一</div>
        </div>

        <!-- Today (unchanged structure) -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="section-title flex items-center gap-2">
                    <i class="fas fa-calendar-day"></i>

            <div class="section-title mb-3 px-1 flex items-center gap-2">

            预报与判断 + 风况图表：Open-Meteo<br>

    <!-- Settings Modal (simplified, no MetService) -->

                <div>
                    <div class="text-sm text-gray-400 mb-2">World Tides 潮汐 Key</div>
                    <div id="tide-key-status" class="mb-3 p-3 bg-gray-700/60 rounded-2xl text-sm"></div>
                    <div id="custom-key-section" class="hidden">
                        <input id="wt-key-input" type="text" placeholder="输入你的 World Tides Key" class="w-full bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-sm outline-none mb-3">

                        <button onclick="testWorldTidesKey()" class="flex-1 bg-gray-600 hover:bg-gray-700 py-2.5 rounded-2xl font-medium text-sm">测试当前 Key</button>
                    </div>
                </div>
            </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-[200]" onclick="if (event.target.id === 'detail-modal') hideDetailModal()">
        <div class="bg-gray-800 w-full md:w-[440px] md:rounded-3xl rounded-t-3xl p-6 max-h-[88vh] overflow-auto" onclick="event.stopImmediatePropagation()">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div id="detail-date" class="text-2xl font-bold"></div>
                    <div id="detail-subtitle" class="text-sm text-gray-400"></div>
                </div>
                <button onclick="hideDetailModal()" class="text-3xl text-gray-400 hover:text-white">×</button>
            </div>

            <div id="detail-light" class="mb-5"></div>
            <div id="detail-weather" class="bg-gray-700/60 rounded-2xl p-4 text-sm mb-5"></div>

            <!-- Apple-style Wind Section -->
            <div id="detail-wind-forecast" class="mb-5">
                <div class="text-sm font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-wind text-emerald-400"></i>
                    <span id="wind-forecast-title">风况</span>
                </div>
                <!-- Current wind summary + Canvas chart will be injected here -->
                <div id="wind-chart-section" class="bg-gray-800 rounded-2xl p-4"></div>
            </div>

            <div id="detail-tide" class="bg-gray-700/60 rounded-2xl p-4 text-sm mb-5"></div>

            <button onclick="window.open('https://tides.niwa.co.nz/', '_blank')" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-2xl font-medium flex items-center justify-center gap-2">
                <i class="fas fa-external-link-alt"></i>
                <span>去 NIWA 查看最准确潮汐</span>
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            lat: -36.83,
            lon: 174.79,
            locationName: "North Shore",
            refreshIntervalMin: 30,
            TIMEZONE: "Pacific/Auckland"
        };

        const GEAR = {
            light: { label: "轻套 (2-4kg)", maxGoodWind: 10, maxAcceptableWind: 14 },
            medium: { label: "中套 (4-8kg)", maxGoodWind: 15, maxAcceptableWind: 21 }
        };

        // Default key (base64, protected)
        const DEFAULT_WORLD_TIDES_KEY = atob("ZGYyMjVkMDUtMzljYy00Y2QzLWIzZjYtYzRjOWI4NTQzMjc2");

        function getWorldTidesKey() {
            return localStorage.getItem("worldtides_key") || DEFAULT_WORLD_TIDES_KEY;
        }

        function isUsingCustomKey() {
            return !!localStorage.getItem("worldtides_key");
        }

        function getWindDirText(deg) {
            if (deg == null || isNaN(deg)) return '';
            const dirs = ["北","北偏东","东北","东偏北","东","东偏南","东南","南偏东","南","南偏西","西南","西偏南","西","西偏北","西北","北偏西"];
            return dirs[Math.floor((deg + 11.25) / 22.5) % 16] + "风";
        }

        function knots(ms) {
            return Math.round(ms * 0.539957);
        }

        function calculateFishingLight(windKnots, gustKnots, windDeg, rainProb, waveHeightM, tideRangeM) {
            const light = GEAR.light;
            const medium = GEAR.medium;
            let lightScore = 100, mediumScore = 100;
            const issues = [];

            const effL = Math.max(windKnots, gustKnots - 3);
            const effM = Math.max(windKnots, gustKnots - 4);

            if (effL > light.maxAcceptableWind) { lightScore -= 55; issues.push("轻套风太大"); }
            else if (effL > light.maxGoodWind) { lightScore -= 28; issues.push("轻套风偏大"); }

            if (effM > medium.maxAcceptableWind) { mediumScore -= 50; issues.push("中套风太大"); }
            else if (effM > medium.maxGoodWind) { mediumScore -= 22; issues.push("中套风偏大"); }

            if (isBadWindDirection(windDeg)) { lightScore -= 20; mediumScore -= 10; issues.push("东风系"); }

            if (rainProb >= 70) { lightScore -= 14; mediumScore -= 7; issues.push("降雨高"); }
            else if (rainProb >= 50) lightScore -= 7;

            if (waveHeightM >= 1.6) { lightScore -= 18; mediumScore -= 10; issues.push("海浪大"); }
            else if (waveHeightM >= 1.1) lightScore -= 9;

            if (tideRangeM && tideRangeM >= 2.7 && isBadWindDirection(windDeg)) {
                lightScore -= 22; mediumScore -= 11; issues.push("大潮+东风");
            } else if (tideRangeM && tideRangeM >= 2.4) lightScore -= 8;

            const lOK = lightScore >= 52;
            const mOK = mediumScore >= 48;

            let color, label, rec;
            if (lOK) { color = "green"; label = "🟢 绿灯 - 两套都适合"; rec = "轻套 + 中套"; }
            else if (mOK) { color = "yellow"; label = "🟡 黄灯 - 推荐中套"; rec = "中套"; }
            else { color = "red"; label = "🔴 红灯 - 建议在家"; rec = "暂不推荐"; }

            return { color, label, rec, issues: issues.join("，") || "条件尚可" };
        }

        function getLocalDateString(date = new Date()) {
            return date.toLocaleDateString('en-CA', { timeZone: CONFIG.TIMEZONE });
        }

        // ==================== 数据获取 ====================
        async function fetchWeatherData() {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
                    `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code` +
                    `&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
                    `&daily=wind_speed_10m_max,wind_gusts_10m_max,precipitation_probability_max` +
                    `&marine=current,wave_height&timezone=${CONFIG.TIMEZONE}&forecast_days=6`;

                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error("Open-Meteo 请求失败");
                const data = await res.json();
                localStorage.setItem("fl511_weather", JSON.stringify({ data, savedAt: Date.now() }));
                return data;
            } catch (e) {
                console.warn("Weather fetch failed:", e.message);
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function fetchTideData() {
            const key = getWorldTidesKey();
            if (!key) return null;
            try {
                const url = `https://www.worldtides.info/api/v3?lat=${CONFIG.lat}&lon=${CONFIG.lon}&key=${key}&days=7&extremes=&datum=MSL`;
                const res = await fetch(url);
                const json = await res.json();
                if (json.status !== 200 || !json.extremes) return null;

                const byDay = {};
                json.extremes.forEach(item => {
                    const d = new Date(item.date).toLocaleDateString('en-CA', { timeZone: CONFIG.TIMEZONE });
                    if (!byDay[d]) byDay[d] = [];
                    byDay[d].push({ type: item.type, height: item.height, time: new Date(item.date) });
                });
                return byDay;
            } catch (e) {
                console.warn("Tide fetch failed:", e.message);
                return null;
            }
        }

        function loadCachedWeather() {
            try {
                const raw = localStorage.getItem("fl511_weather");
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return { data: parsed.data, savedAt: new Date(parsed.savedAt) };
            } catch { return null; }
        }

        // ==================== Apple-style Wind Chart (Canvas) ====================
        function drawWindChart(canvas, items, isToday) {
            if (!items || items.length === 0) return;

            const ctx = canvas.getContext('2d', { alpha: true });
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();

            // Set actual size in memory (scaled for retina)
            canvas.width = Math.max(600, rect.width) * dpr;
            canvas.height = 240 * dpr;
            ctx.scale(dpr, dpr);

            const width = canvas.width / dpr;
            const height = canvas.height / dpr;
            const padding = { top: 30, right: 12, bottom: 28, left: 36 };

            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, 0, width, height);

            // Data
            const speeds = items.map(i => i.speed);
            const gusts = items.map(i => i.gust);
            const maxSpeed = Math.max(...gusts, ...speeds) || 30;
            const yMax = Math.ceil(maxSpeed / 5) * 5 + 5;

            // Scales
            const xStep = chartWidth / (items.length - 1 || 1);
            const yScale = chartHeight / yMax;

            // Grid
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1;
            for (let y = 0; y <= yMax; y += 5) {
                const yPos = padding.top + chartHeight - y * yScale;
                ctx.beginPath();
                ctx.moveTo(padding.left, yPos);
                ctx.lineTo(width - padding.right, yPos);
                ctx.stroke();
            }

            // Y labels
            ctx.fillStyle = '#9ca3af';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'right';
            for (let y = 0; y <= yMax; y += 5) {
                const yPos = padding.top + chartHeight - y * yScale + 4;
                ctx.fillText(y, padding.left - 6, yPos);
            }

            // Area + line for wind speed (teal gradient)
            const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartHeight);
            gradient.addColorStop(0, 'rgba(52, 211, 153, 0.35)');
            gradient.addColorStop(1, 'rgba(16, 185, 129, 0.05)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            items.forEach((item, i) => {
                const x = padding.left + i * xStep;
                const y = padding.top + chartHeight - item.speed * yScale;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.lineTo(padding.left + (items.length - 1) * xStep, padding.top + chartHeight);
            ctx.lineTo(padding.left, padding.top + chartHeight);
            ctx.closePath();
            ctx.fill();

            // Wind speed line
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            items.forEach((item, i) => {
                const x = padding.left + i * xStep;
                const y = padding.top + chartHeight - item.speed * yScale;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Gust line (lighter / dashed)
            ctx.strokeStyle = '#6ee7b7';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            items.forEach((item, i) => {
                const x = padding.left + i * xStep;
                const y = padding.top + chartHeight - item.gust * yScale;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.setLineDash([]);

            // Small direction arrows at top
            items.forEach((item, i) => {
                if (i % 2 !== 0) return; // sample every other
                const x = padding.left + i * xStep;
                const arrowY = padding.top - 8;
                const rotation = (item.dir + 180) % 360; // blowing toward

                ctx.save();
                ctx.translate(x, arrowY);
                ctx.rotate((rotation * Math.PI) / 180);
                ctx.fillStyle = '#34d399';
                ctx.beginPath();
                ctx.moveTo(0, -6);
                ctx.lineTo(-4, 4);
                ctx.lineTo(4, 4);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // X labels (time)
            ctx.fillStyle = '#9ca3af';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';
            items.forEach((item, i) => {
                if (i % 3 !== 0 && i !== items.length - 1) return;
                const x = padding.left + i * xStep;
                const label = item.time.toLocaleTimeString('zh-CN', { hour: '2-digit' });
                ctx.fillText(label, x, height - 6);
            });

            // "Now" marker for today view
            if (isToday && items.length > 1) {
                const nowIdx = 0; // since we filter from now, first item is closest to now
                const x = padding.left + nowIdx * xStep;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + chartHeight);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, padding.top + chartHeight - items[nowIdx].speed * yScale, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== Modal & Rendering (updated for chart) ====================
        function showDetailModal(type, index = 0, weatherData = null, tideData = null) {
            const modal = document.getElementById("detail-modal");
            const weather = weatherData || window.lastWeatherData;
            if (!weather) return;

            const daily = weather.daily;
            const current = weather.current || {};
            const date = new Date();

            let wind, gust, dir, rain, wave, tideRange, dayKey, effectiveTides;

            if (type === "today") {
                effectiveTides = tideData || (window.currentTodayData ? window.currentTodayData.tides : null);

                wind = Math.round(current.wind_speed_10m || daily.wind_speed_10m_max[0]);
                gust = Math.round(current.wind_gusts_10m || daily.wind_gusts_10m_max[0]);
                dir = Math.round(current.wind_direction_10m || daily.wind_direction_10m_dominant[0]);
                rain = Math.round(daily.precipitation_probability_max[0] || 0);
                wave = weather.marine?.current?.[0]?.wave_height ? parseFloat(weather.marine.current[0].wave_height) : null;
                dayKey = getLocalDateString();
                tideRange = effectiveTides?.[dayKey]?.range || null;
            } else {
                date.setDate(date.getDate() + index);
                dayKey = getLocalDateString(date);
                wind = Math.round(daily.wind_speed_10m_max[index]);
                gust = Math.round(daily.wind_gusts_10m_max?.[index] || wind);
                dir = daily.wind_direction_10m_dominant?.[index];
                rain = Math.round(daily.precipitation_probability_max?.[index] || 0);
                wave = null;
                effectiveTides = tideData;
                tideRange = effectiveTides?.[dayKey]?.range || null;
            }

            const result = calculateFishingLight(wind, gust, dir, rain, wave, tideRange);

            document.getElementById("detail-date").textContent = date.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
            document.getElementById("detail-subtitle").textContent = CONFIG.locationName;

            document.getElementById("detail-light").innerHTML = `
                <div class="rounded-2xl p-5 text-black ${result.color}">
                    <div class="text-3xl font-bold">${result.label}</div>
                    <div class="mt-1">${result.issues}</div>
                    <div class="mt-3 font-medium">推荐：${result.rec}</div>
                </div>
            `;

            document.getElementById("detail-weather").innerHTML = `
                <div class="font-medium mb-2">天气概况</div>
                <div class="space-y-1 text-sm">
                    <div class="flex justify-between"><span>风速</span><span class="font-mono">${wind} knots</span></div>
                    <div class="flex justify-between"><span>阵风</span><span class="font-mono">${gust} knots</span></div>
                    <div class="flex justify-between"><span>降雨概率</span><span>${rain}%</span></div>
                    ${wave ? `<div class="flex justify-between"><span>海浪</span><span>${wave.toFixed(1)}m</span></div>` : ''}
                </div>
            `;

            // === New Apple-style Wind Section ===
            const windSection = document.getElementById("wind-chart-section") || document.getElementById("wind-hourly-container");
            windSection.innerHTML = '';

            // Current wind header
            const header = document.createElement('div');
            header.className = 'flex justify-between items-baseline mb-2 px-1';
            header.innerHTML = `
                <div>
                    <span class="text-3xl font-bold">${wind}</span>
                    <span class="text-lg ml-1">knots</span>
                    <span class="ml-2 text-emerald-400">${getWindDirText(dir)}</span>
                </div>
                <div class="text-right text-sm">
                    <div>Gusts: <span class="font-mono">${gust}</span></div>
                </div>
            `;
            windSection.appendChild(header);

            // Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 620;
            canvas.height = 220;
            canvas.className = 'w-full rounded-xl bg-gray-800';
            windSection.appendChild(canvas);

            // Prepare data for chart (reuse existing filtering logic)
            let chartItems;
            if (type === "today") {
                // Reuse the filtering logic
                const tempContainer = { innerHTML: '' };
                renderTodayRemainingHourlyWind(weather, tempContainer); // side effect to get items? Better refactor later
                // For now, duplicate small logic for demo
                const hourly = weather.hourly;
                const now = new Date();
                const currentNZ = new Date(now.toLocaleString("en-US", { timeZone: CONFIG.TIMEZONE }));
                const todayStr = getLocalDateString(currentNZ);
                chartItems = [];
                for (let i = 0; i < hourly.time.length; i++) {
                    const t = new Date(hourly.time[i]);
