<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="北岸钓鱼红绿灯">
    <meta name="theme-color" content="#111827">
    <title>北岸钓鱼红绿灯 v5.2 (修复版) | Auckland North Shore</title>

    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .light-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .light-card:active { transform: scale(0.985); }
        .green { background: linear-gradient(135deg, #10b981, #34d399); }
        .yellow { background: linear-gradient(135deg, #eab308, #facc15); }
        .red { background: linear-gradient(135deg, #ef4444, #f87171); }
        .wind-arrow { transition: transform 0.3s ease; display: inline-block; }
        .hourly-scroll { scrollbar-width: thin; }
        .hourly-scroll::-webkit-scrollbar { height: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto p-6">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold tracking-tight">🎣 北岸钓鱼红绿灯 <span class="text-base text-gray-500 align-super">v5.2</span></h1>
            <p class="text-gray-400 mt-1">稳健版 · 修复更新卡顿和风况显示问题</p>
            
            <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-gray-800 rounded-full text-sm">
                    <i class="fas fa-map-marker-alt text-emerald-400"></i>
                    <span id="location-text">North Shore</span>
                </div>
                <button onclick="showSettingsModal()" class="inline-flex items-center gap-2 px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">
                    <i class="fas fa-cog"></i><span>设置</span>
                </button>
                <button onclick="showLogicModal()" class="inline-flex items-center gap-2 px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded-full text-sm transition-colors">
                    <i class="fas fa-info-circle text-amber-400"></i><span>数据来源</span>
                </button>
            </div>
            
            <div id="update-status" class="text-xs text-gray-500 mt-2 font-mono"></div>
        </div>

        <div class="mb-7">
            <button onclick="window.open('https://tides.niwa.co.nz/', '_blank', 'noopener')"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition-colors rounded-2xl flex items-center justify-center gap-2 font-medium">
                <i class="fas fa-external-link-alt"></i>
                <span>打开 NIWA 官方潮汐查询（最准确）</span>
            </button>
            <div class="text-center text-[10px] text-gray-500 mt-1.5">实时精确潮汐请以 NIWA 为准 • 安全第一</div>
        </div>

        <!-- Today -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="section-title flex items-center gap-2">
                    <i class="fas fa-calendar-day"></i>
                    <span>今天 (Today)</span>
                </div>
                <button onclick="refreshData()" 
                        class="flex items-center gap-2 text-sm px-4 py-1.5 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 rounded-full transition-colors">
                    <i class="fas fa-sync-alt"></i> 
                    <span id="refresh-text">刷新</span>
                </button>
            </div>
            
            <div id="today-card" class="light-card bg-gray-800 rounded-3xl p-7 shadow-inner cursor-pointer" onclick="showDetailModal('today')"></div>
            <div id="today-meta" class="mt-3 px-1 text-xs text-gray-400 flex flex-wrap gap-x-5 gap-y-1"></div>
        </div>

        <!-- 5-Day Forecast -->
        <div>
            <div class="section-title mb-3 px-1 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i>
                <span>未来 5 天预报（从明天开始）</span>
            </div>
            <div id="forecast-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <div class="mt-10 text-center text-[10px] text-gray-500 pb-16">
            预报与判断：Open-Meteo<br>
            实测参考：MetService WIS2（奥克兰机场站 93110）<br>
            仅供参考 • 安全第一
        </div>
    </div>

    <!-- Settings -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[300]" onclick="if (event.target.id === 'settings-modal') hideSettingsModal()">
        <div class="bg-gray-800 rounded-3xl w-full max-w-md mx-4 p-6" onclick="event.stopImmediatePropagation()">
            <h2 class="text-2xl font-bold mb-5">设置</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-1.5">World Tides API Key（可选）</label>
                    <input id="wt-key-input" type="text" placeholder="用于显示详细潮汐" class="w-full bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-sm outline-none">
                    <div class="text-xs text-gray-500 mt-1">去 worldtides.info 免费注册</div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="saveSettingsAndRefresh()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 py-3 rounded-2xl font-medium">保存并刷新</button>
                    <button onclick="hideSettingsModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-2xl">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-[200]" onclick="if (event.target.id === 'detail-modal') hideDetailModal()">
        <div class="bg-gray-800 w-full md:w-[440px] md:rounded-3xl rounded-t-3xl p-6 max-h-[88vh] overflow-auto" onclick="event.stopImmediatePropagation()">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div id="detail-date" class="text-2xl font-bold"></div>
                    <div id="detail-subtitle" class="text-sm text-gray-400"></div>
                </div>
                <button onclick="hideDetailModal()" class="text-3xl text-gray-400 hover:text-white">×</button>
            </div>

            <div id="detail-light" class="mb-5"></div>

            <div id="detail-metservice" class="mb-5 hidden">
                <div class="text-sm font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-satellite text-blue-400"></i>
                    <span>MetService 实测（奥克兰机场站）</span>
                </div>
                <div id="metservice-obs" class="bg-gray-700/60 rounded-2xl p-4 text-sm"></div>
            </div>

            <div id="detail-weather" class="bg-gray-700/60 rounded-2xl p-4 text-sm mb-5"></div>

            <div id="detail-wind-forecast" class="mb-5">
                <div class="text-sm font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-wind text-emerald-400"></i>
                    <span>风况预报（逐小时）</span>
                </div>
                <div id="wind-hourly-container" class="bg-gray-700/60 rounded-2xl p-4"></div>
            </div>

            <div id="detail-tide" class="bg-gray-700/60 rounded-2xl p-4 text-sm mb-5"></div>

            <button onclick="window.open('https://tides.niwa.co.nz/', '_blank')" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-2xl font-medium flex items-center justify-center gap-2">
                <i class="fas fa-external-link-alt"></i>
                <span>去 NIWA 查看最准确潮汐</span>
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            lat: -36.83,
            lon: 174.79,
            locationName: "North Shore",
            refreshIntervalMin: 30,
            TIMEZONE: "Pacific/Auckland"
        };

        const GEAR = {
            light: { label: "轻套 (2-4kg)", maxGoodWind: 10, maxAcceptableWind: 14 },
            medium: { label: "中套 (4-8kg)", maxGoodWind: 15, maxAcceptableWind: 21 }
        };

        const METSERVICE_STATION = {
            name: "奥克兰机场站 (Auckland Aero)",
            wigos: "0-20000-0-93110",
            note: "MetService 为 Devonport 区域使用的参考站"
        };

        function getWindDirText(deg) {
            if (deg == null || isNaN(deg)) return '';
            const dirs = ["北","北偏东","东北","东偏北","东","东偏南","东南","南偏东","南","南偏西","西南","西偏南","西","西偏北","西北","北偏西"];
            return dirs[Math.floor((deg + 11.25) / 22.5) % 16] + "风";
        }

        function isBadWindDirection(deg) {
            if (deg == null) return false;
            return deg >= 60 && deg <= 130;
        }

        function formatTime(date) {
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function knots(ms) {
            return Math.round(ms * 1.944);
        }

        function calculateFishingLight(windKnots, gustKnots, windDeg, rainProb, waveHeightM, tideRangeM) {
            const light = GEAR.light;
            const medium = GEAR.medium;
            let lightScore = 100, mediumScore = 100;
            const issues = [];

            const effL = Math.max(windKnots, gustKnots - 3);
            const effM = Math.max(windKnots, gustKnots - 4);

            if (effL > light.maxAcceptableWind) { lightScore -= 55; issues.push("轻套风太大"); }
            else if (effL > light.maxGoodWind) { lightScore -= 28; issues.push("轻套风偏大"); }

            if (effM > medium.maxAcceptableWind) { mediumScore -= 50; issues.push("中套风太大"); }
            else if (effM > medium.maxGoodWind) { mediumScore -= 22; issues.push("中套风偏大"); }

            if (isBadWindDirection(windDeg)) { lightScore -= 20; mediumScore -= 10; issues.push("东风系"); }

            if (rainProb >= 70) { lightScore -= 14; mediumScore -= 7; issues.push("降雨高"); }
            else if (rainProb >= 50) lightScore -= 7;

            if (waveHeightM >= 1.6) { lightScore -= 18; mediumScore -= 10; issues.push("海浪大"); }
            else if (waveHeightM >= 1.1) lightScore -= 9;

            if (tideRangeM && tideRangeM >= 2.7 && isBadWindDirection(windDeg)) {
                lightScore -= 22; mediumScore -= 11; issues.push("大潮+东风");
            } else if (tideRangeM && tideRangeM >= 2.4) lightScore -= 8;

            const lOK = lightScore >= 52;
            const mOK = mediumScore >= 48;

            let color, label, rec;
            if (lOK) { color = "green"; label = "🟢 绿灯 - 两套都适合"; rec = "轻套 + 中套"; }
            else if (mOK) { color = "yellow"; label = "🟡 黄灯 - 推荐中套"; rec = "中套"; }
            else { color = "red"; label = "🔴 红灯 - 建议在家"; rec = "暂不推荐"; }

            return { color, label, rec, issues: issues.join("，") || "条件尚可" };
        }

        // ==================== 工具函数 ====================
        function getLocalDateString(date = new Date()) {
            // 始终使用 Pacific/Auckland 时间计算“今天”
            return date.toLocaleDateString('en-CA', { timeZone: CONFIG.TIMEZONE }); // 返回 YYYY-MM-DD
        }

        // ==================== 数据获取 ====================
        async function fetchWeatherData() {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
                `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code` +
                `&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
                `&daily=wind_speed_10m_max,wind_gusts_10m_max,precipitation_probability_max` +
                `&marine=current,wave_height&timezone=${CONFIG.TIMEZONE}&forecast_days=6`;

            const res = await fetch(url);
            if (!res.ok) throw new Error("Open-Meteo 请求失败");
            const data = await res.json();
            localStorage.setItem("fl52_weather", JSON.stringify({ data, savedAt: Date.now() }));
            return data;
        }

        async function fetchMetServiceObservations() {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 7000);

            try {
                const url = `https://wis2.metservice.com/oapi/collections/urn:wmo:md:nz-metservice:surface-based-observations.synop/items?wigos_station_identifier=${METSERVICE_STATION.wigos}&limit=15&f=json`;
                const res = await fetch(url, { signal: controller.signal });
                const json = await res.json();

                if (!json.features?.length) return null;

                const reports = {};
                json.features.forEach(f => {
                    const p = f.properties;
                    const rid = p.reportId;
                    if (!reports[rid]) reports[rid] = {};
                    reports[rid][p.name] = p.value;
                    reports[rid].time = p.phenomenonTime || p.reportTime;
                });

                let best = null;
                Object.values(reports).forEach(r => {
                    if (r.wind_speed != null) {
                        const t = new Date(r.time);
                        if (!best || t > best.time) {
                            best = {
                                wind_knots: knots(r.wind_speed),
                                direction: r.wind_direction,
                                time: t
                            };
                        }
                    }
                });

                if (best) {
                    best.station = METSERVICE_STATION.name;
                    return best;
                }
                return null;
            } catch (e) {
                console.log("MetService 获取失败（已忽略）:", e.message);
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function fetchTideData(key) {
            if (!key) return null;
            try {
                const url = `https://www.worldtides.info/api/v3?lat=${CONFIG.lat}&lon=${CONFIG.lon}&key=${key}&days=7&datum=LAT`;
                const res = await fetch(url);
                const json = await res.json();
                if (json.status !== 200 || !json.extremes) return null;

                const byDay = {};
                json.extremes.forEach(item => {
                    const d = new Date(item.date).toLocaleDateString('en-CA', { timeZone: CONFIG.TIMEZONE });
                    if (!byDay[d]) byDay[d] = [];
                    byDay[d].push({ type: item.type, height: item.height, time: new Date(item.date) });
                });
                return byDay;
            } catch { return null; }
        }

        function loadCachedWeather() {
            try {
                const r = localStorage.getItem("fl52_weather");
                return r ? JSON.parse(r) : null;
            } catch { return null; }
        }

        // ==================== 渲染 ====================
        function renderToday(weather, tides, metObs) {
            const container = document.getElementById("today-card");
            const meta = document.getElementById("today-meta");
            if (!weather) {
                container.innerHTML = `<div class="text-red-400 py-8 text-center">数据加载失败</div>`;
                return;
            }

            const daily = weather.daily;
            const cur = weather.current || {};

            const wind = Math.round(cur.wind_speed_10m || daily.wind_speed_10m_max[0]);
            const gust = Math.round(cur.wind_gusts_10m || daily.wind_gusts_10m_max[0]);
            const dir = Math.round(cur.wind_direction_10m || daily.wind_direction_10m_dominant[0]);
            const rain = Math.round(daily.precipitation_probability_max[0] || 0);
            const wave = weather.marine?.current?.[0]?.wave_height ? parseFloat(weather.marine.current[0].wave_height) : null;

            const todayKey = getLocalDateString();
            const tideRange = tides?.[todayKey]?.range || null;

            const result = calculateFishingLight(wind, gust, dir, rain, wave, tideRange);

            container.className = `light-card rounded-3xl p-7 shadow-inner cursor-pointer text-black ${result.color}`;
            container.innerHTML = `
                <div class="text-6xl mb-3">${result.label}</div>
                <div class="text-2xl font-medium">${wind} knots ${getWindDirText(dir)}</div>
                <div class="mt-5 text-lg">${result.issues}</div>
                <div class="mt-6 text-sm font-medium">推荐：${result.rec}</div>
            `;

            let metaHtml = `<div>阵风最高 ${gust} knots</div>`;
            if (wave) metaHtml += `<div>海浪约 ${wave.toFixed(1)}m</div>`;
            metaHtml += `<div>降雨概率 ${rain}%</div>`;
            if (tideRange) metaHtml += `<div>潮差约 ${tideRange.toFixed(1)}m</div>`;
            meta.innerHTML = metaHtml;

            window.currentTodayData = { weather, tides };
        }

        function renderForecast(weather, tides) {
            const grid = document.getElementById("forecast-grid");
            grid.innerHTML = "";
            const daily = weather.daily;

            for (let i = 1; i <= 5; i++) {
                const d = new Date(); d.setDate(d.getDate() + i);
                const key = getLocalDateString(d);

                const mw = Math.round(daily.wind_speed_10m_max[i]);
                const mg = Math.round(daily.wind_gusts_10m_max?.[i] || mw);
                const md = daily.wind_direction_10m_dominant?.[i];
                const mr = Math.round(daily.precipitation_probability_max?.[i] || 0);
                const tr = tides?.[key]?.range || null;

                const res = calculateFishingLight(mw, mg, md, mr, null, tr);

                const card = document.createElement("div");
                card.className = `light-card rounded-2xl p-5 text-black ${res.color} cursor-pointer`;
                card.innerHTML = `
                    <div class="font-medium">${d.toLocaleDateString('zh-CN', { weekday: 'short', month: 'numeric', day: 'numeric' })}</div>
                    <div class="text-4xl my-4">${res.label.split(" - ")[0]}</div>
                    <div class="text-sm">${mw} knots ${getWindDirText(md)}</div>
                    <div class="text-xs mt-1 opacity-80">阵风 ${mg} · 降雨 ${mr}%</div>
                    ${tr ? `<div class="text-xs mt-1 opacity-80">潮差约 ${tr.toFixed(1)}m</div>` : ''}
                    <div class="mt-3 text-xs font-medium">${res.rec}</div>
                `;
                card.onclick = () => showDetailModal("forecast", i, weather, tides);
                grid.appendChild(card);
            }
        }

        function updateStatus(savedAt) {
            const el = document.getElementById("update-status");
            const t = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
            let html = `更新时间：${t} NZST`;
            if (savedAt) {
                const m = Math.floor((Date.now() - savedAt.getTime()) / 60000);
                html += ` <span class="text-amber-400/70">(${m}分钟前缓存)</span>`;
            }
            el.innerHTML = html;
        }

        function updateMetServiceInUI(metObs) {
            if (!metObs) return;
            window.lastMetObs = metObs;

            const meta = document.getElementById("today-meta");
            if (meta && !meta.innerHTML.includes("实测")) {
                meta.innerHTML += `<div class="text-blue-300">实测 ${metObs.wind_knots} knots（MetService）</div>`;
            }
        }

        // ==================== 详情页 ====================
        function showDetailModal(type, index = 0, weatherData = null, tideData = null) {
            const modal = document.getElementById("detail-modal");
            const weather = weatherData || window.lastWeatherData;
            if (!weather) return;

            const daily = weather.daily;
            const current = weather.current || {};
            const date = new Date();

            let wind, gust, dir, rain, wave, tideRange, dayKey;

            if (type === "today") {
                wind = Math.round(current.wind_speed_10m || daily.wind_speed_10m_max[0]);
                gust = Math.round(current.wind_gusts_10m || daily.wind_gusts_10m_max[0]);
                dir = Math.round(current.wind_direction_10m || daily.wind_direction_10m_dominant[0]);
                rain = Math.round(daily.precipitation_probability_max[0] || 0);
                wave = weather.marine?.current?.[0]?.wave_height ? parseFloat(weather.marine.current[0].wave_height) : null;
                dayKey = getLocalDateString();
                tideRange = tideData?.[dayKey]?.range || null;
            } else {
                date.setDate(date.getDate() + index);
                dayKey = getLocalDateString(date);
                wind = Math.round(daily.wind_speed_10m_max[index]);
                gust = Math.round(daily.wind_gusts_10m_max?.[index] || wind);
                dir = daily.wind_direction_10m_dominant?.[index];
                rain = Math.round(daily.precipitation_probability_max?.[index] || 0);
                wave = null;
                tideRange = tideData?.[dayKey]?.range || null;
            }

            const result = calculateFishingLight(wind, gust, dir, rain, wave, tideRange);

            document.getElementById("detail-date").textContent = date.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
            document.getElementById("detail-subtitle").textContent = CONFIG.locationName;

            document.getElementById("detail-light").innerHTML = `
                <div class="rounded-2xl p-5 text-black ${result.color}">
                    <div class="text-3xl font-bold">${result.label}</div>
                    <div class="mt-1">${result.issues}</div>
                    <div class="mt-3 font-medium">推荐：${result.rec}</div>
                </div>
            `;

            // MetService
            const msBox = document.getElementById("detail-metservice");
            if (type === "today" && window.lastMetObs) {
                const o = window.lastMetObs;
                document.getElementById("metservice-obs").innerHTML = `
                    <div class="flex justify-between">
                        <div>最新实测</div>
                        <div class="font-mono font-bold">${o.wind_knots} knots ${getWindDirText(o.direction)}</div>
                    </div>
                    <div class="text-[10px] text-gray-400 mt-1">${o.station} · ${o.time.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}</div>
                `;
                msBox.classList.remove("hidden");
            } else {
                msBox.classList.add("hidden");
            }

            document.getElementById("detail-weather").innerHTML = `
                <div class="font-medium mb-2">天气概况</div>
                <div class="space-y-1 text-sm">
                    <div class="flex justify-between"><span>风速</span><span class="font-mono">${wind} knots</span></div>
                    <div class="flex justify-between"><span>阵风</span><span class="font-mono">${gust} knots</span></div>
                    <div class="flex justify-between"><span>降雨概率</span><span>${rain}%</span></div>
                    ${wave ? `<div class="flex justify-between"><span>海浪</span><span>${wave.toFixed(1)}m</span></div>` : ''}
                </div>
            `;

            const windContainer = document.getElementById("wind-hourly-container");
            renderHourlyWind(weather, type === "today" ? 0 : index, windContainer);

            // Tide
            let tideHtml = `<div class="font-medium mb-2">潮汐</div>`;
            const dayTides = tideData?.[dayKey];
            if (dayTides && dayTides.length) {
                dayTides.slice(0, 4).forEach(t => {
                    tideHtml += `<div class="flex justify-between text-sm py-0.5"><span>${t.type === "High" ? "高潮" : "低潮"}</span><span class="font-mono">${t.height.toFixed(2)}m ${formatTime(t.time)}</span></div>`;
                });
                if (tideRange) tideHtml += `<div class="text-xs mt-1 text-gray-400">潮差约 ${tideRange.toFixed(1)}m</div>`;
            } else {
                tideHtml += `<div class="text-gray-400 text-sm">暂无潮汐数据</div>`;
            }
            document.getElementById("detail-tide").innerHTML = tideHtml;

            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function renderHourlyWind(weather, dayOffset, container) {
            if (!weather?.hourly?.time?.length) {
                container.innerHTML = `<div class="text-gray-400 text-sm py-3">无逐小时数据</div>`;
                return;
            }

            const hourly = weather.hourly;
            const targetDay = getLocalDateString(new Date(Date.now() + dayOffset * 86400000));

            const items = [];
            for (let i = 0; i < hourly.time.length; i++) {
                const t = hourly.time[i];
                if (t.slice(0, 10) === targetDay) {
                    items.push({
                        time: new Date(t),
                        speed: Math.round(hourly.wind_speed_10m[i] * 0.539957),
                        gust: Math.round(hourly.wind_gusts_10m[i] * 0.539957),
                        dir: Math.round(hourly.wind_direction_10m[i])
                    });
                }
            }

            if (items.length === 0) {
                container.innerHTML = `<div class="text-gray-400 text-sm py-3">当天无逐小时风况数据</div>`;
                return;
            }

            const maxVal = Math.max(...items.map(i => Math.max(i.speed, i.gust)));

            let html = `<div class="flex gap-2 overflow-x-auto pb-2 hourly-scroll">`;
            items.forEach(item => {
                const pct = Math.max(10, Math.round((item.gust / maxVal) * 100));
                html += `
                    <div class="min-w-[58px] text-center text-xs bg-gray-800 rounded-xl p-2 flex-shrink-0">
                        <div class="text-gray-400">${item.time.toLocaleTimeString('zh-CN', {hour:'2-digit'})}</div>
                        <div class="my-1">
                            <i class="fas fa-arrow-up wind-arrow text-emerald-400" style="transform: rotate(${item.dir}deg)"></i>
                        </div>
                        <div class="font-mono text-sm font-bold">${item.speed}</div>
                        <div class="text-[10px] text-gray-400">${item.gust}</div>
                        <div class="h-1.5 bg-gray-700 rounded mt-1 overflow-hidden">
                            <div class="h-1.5 bg-emerald-400" style="width:${pct}%"></div>
                        </div>
                    </div>
                `;
            });
            html += `</div><div class="text-[10px] text-gray-400 mt-1 text-center">风速 / 阵风 (knots) · 箭头指向风向</div>`;
            container.innerHTML = html;
        }

        function hideDetailModal() {
            const m = document.getElementById("detail-modal");
            m.classList.remove("flex");
            m.classList.add("hidden");
        }

        // ==================== 主流程（带 finally 保证重置按钮） ====================
        async function refreshData(forceFresh = false) {
            const rt = document.getElementById("refresh-text");
            rt.innerHTML = `<i class="fas fa-sync-alt fa-spin"></i> 更新中...`;

            let weather = null;
            let tides = null;

            try {
                weather = await fetchWeatherData();
            } catch (e) {
                const cached = loadCachedWeather();
                if (cached) weather = cached.data;
            }

            if (!weather) {
                document.getElementById("today-card").innerHTML = `<div class="text-red-400 py-8 text-center">无法获取天气数据</div>`;
                rt.textContent = "刷新";
                return;
            }

            window.lastWeatherData = weather;

            const tideKey = localStorage.getItem("worldtides_key");
            if (tideKey) {
                try {
                    tides = await fetchTideData(tideKey);
                } catch (e) {}
            }

            const cached = loadCachedWeather();
            renderToday(weather, tides, window.lastMetObs);
            renderForecast(weather, tides);
            updateStatus(cached ? cached.savedAt : null);

            rt.textContent = "刷新";

            // 异步 MetService
            fetchMetServiceObservations().then(obs => {
                if (obs) updateMetServiceInUI(obs);
            });
        }

        // 设置相关
        function showSettingsModal() {
            const modal = document.getElementById("settings-modal");
            document.getElementById("wt-key-input").value = localStorage.getItem("worldtides_key") || "";
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function hideSettingsModal() {
            const m = document.getElementById("settings-modal");
            m.classList.remove("flex");
            m.classList.add("hidden");
        }

        async function saveSettingsAndRefresh() {
            const v = document.getElementById("wt-key-input").value.trim();
            if (v) localStorage.setItem("worldtides_key", v);
            else localStorage.removeItem("worldtides_key");
            hideSettingsModal();
            await refreshData(true);
        }

        function showLogicModal() {
            document.getElementById("logic-modal").classList.remove("hidden");
            document.getElementById("logic-modal").classList.add("flex");
        }

        function hideLogicModal() {
            document.getElementById("logic-modal").classList.remove("flex");
            document.getElementById("logic-modal").classList.add("hidden");
        }

        async function init() {
            document.getElementById("location-text").textContent = CONFIG.locationName;

            const cw = loadCachedWeather();
            if (cw) {
                window.lastWeatherData = cw.data;
                renderToday(cw.data, null, window.lastMetObs);
                renderForecast(cw.data, null);
                updateStatus(cw.savedAt);
            }

            await refreshData();

            setInterval(() => refreshData(), CONFIG.refreshIntervalMin * 60 * 1000);
        }

        init();
    </script>
</body>
</html>
